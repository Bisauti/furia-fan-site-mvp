# .github/workflows/deploy.yml

name: Deploy to GitHub Pages

on:
  # Trigger the workflow on pushes to the deploy branch
  # Você pode mudar 'deploy-pages' para 'main' ou outra branch se preferir
  push:
    branches:
      - deploy-pages # ✅ Mude para a branch que você usa para deploy (ex: main)

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the previous run and the current run.
# However, do NOT cancel in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest # Roda em um servidor Ubuntu

    steps:
      - name: Checkout your code # Clona seu repositório
        uses: actions/checkout@v4

      - name: Setup Node.js # Configura o ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # ✅ Use uma versão LTS do Node.js

      - name: Install dependencies # Instala as dependências do seu projeto
        run: npm install # Ou 'yarn install' se usar yarn

      - name: Build project # Roda o comando de build do Vite
        run: npm run build # Ou 'yarn build' se usar yarn

      - name: Setup Pages # Configura o ambiente para o deploy do GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact # Empacota os arquivos da pasta dist para deploy
        uses: actions/upload-pages-artifact@v3
        with:
          # O conteúdo da pasta dist será o que será publicado
          path: './dist' # ✅ Confirme que seu build gera a pasta 'dist'

  # Deployment job
  deploy:
    environment:
      name: github-pages # Nome do ambiente de deploy
      url: ${{ steps.deployment.outputs.page_url }} # URL do site publicado
    runs-on: ubuntu-latest # Roda em um servidor Ubuntu
    needs: build # Garante que este job só roda depois que o job 'build' terminar com sucesso

    steps:
      - name: Deploy to GitHub Pages # Faz o deploy usando o artefato (pasta dist) do job anterior
        id: deployment
        uses: actions/deploy-pages@v4